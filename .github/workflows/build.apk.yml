name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Run Build and Backup Files
      run: |
        gradle wrapper
        chmod +x ./gradlew
        ./gradlew build || echo "Gradle build attempted"
        mkdir -p output_backup
        cp -r app/build/outputs/apk output_backup/ || echo "No apk folder"

    - name: Upload Workspace Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ultron-full-output
        path: |
          output_backup/
          app/build/outputs/
          **/*.apk
        if-no-files-found: warn

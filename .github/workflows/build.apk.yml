name: Build ULTRON APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Prepare Dashboard Resources & Daily Learning Log
      run: |
        echo "Ultron Supreme AI Elite UI & Daily Learning Log Integration Active"

    - name: Build APK Directly
      run: gradle assembleDebug --refresh-dependencies --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ULTRON-APK
        path: |
          build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk

name: Build ULTRON APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Prepare Project Structure
      run: |
        # Ensure proper settings.gradle exists
        echo "include ':app'" > settings.gradle
        
        # Ensure app directory exists and move loose files inside if needed
        mkdir -p app/src/main
        
        # Move files to app directory if they are sitting in root
        [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app/src/main/ || true
        [ -d res ] && cp -r res app/src/main/ || true
        [ -d assets ] && cp -r assets app/src/main/ || true
        [ -d src ] && cp -r src/* app/src/main/ || true

    - name: Build Debug APK
      run: gradle :app:assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ULTRON-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk

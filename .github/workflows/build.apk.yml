name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle Wrapper and Build
      run: |
        gradle wrapper
        chmod +x ./gradlew
        ./gradlew assemble || ./gradlew build || echo "Build attempted"

    - name: Upload Any Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: ultron-apk-output
        path: |
          **/*.apk
          app/build/outputs/apk/debug/*.apk
        if-no-files-found: ignore

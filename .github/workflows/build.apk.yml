name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Project
      run: |
        gradle wrapper
        chmod +x ./gradlew
        ./gradlew build || echo "Gradle build attempted"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Ultron-Files
        path: |
          **/*.apk
          **/build/outputs/**/*.apk
          app/build/outputs/
          build/
